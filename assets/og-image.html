<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  SOURCE FOR assets/og-image.png — the link preview card.

  Regenerate after any change to the name, title or positioning line:

    cd ~/portfolio_projects/myportfolioos_site
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --no-sandbox --hide-scrollbars \
      --user-data-dir=/tmp/og --virtual-time-budget=8000 \
      --window-size=1200,630 --screenshot=assets/og-image.png \
      "file://$PWD/assets/og-image.html"
    pkill -f /tmp/og

  1200x630 is the size LinkedIn, Slack and iMessage all crop least. Everything
  important sits inside a 90px margin because some clients crop to 1.91:1 and
  others to a square thumbnail.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Palette copied from landing.css on purpose: the card and the page have to
     look like the same object when someone clicks through from the preview. */
  :root {
    --bg:      #f7f5f1;
    --surface: #fbfaf7;
    --text:    #1c1a17;
    --muted:   #5d574e;
    --line:    #e4e0d8;
    --chip:    #d8d3c9;
    --accent:  oklch(0.55 0.14 42);
    --sans: 'Instrument Sans', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 84px 90px 76px;
  }

  .top { display: flex; align-items: center; gap: 26px; }
  .avatar {
    width: 84px; height: 84px;
    flex: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 29px; font-weight: 600; letter-spacing: 0.02em;
  }
  .name { font-size: 58px; font-weight: 600; letter-spacing: -0.025em; line-height: 1; }
  .role {
    font-family: var(--mono);
    font-size: 17px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 12px;
  }

  .lede {
    font-size: 35px;
    line-height: 1.35;
    letter-spacing: -0.015em;
    max-width: 1010px;
  }
  .lede em { font-style: italic; color: var(--accent); }

  .bottom { display: flex; align-items: center; gap: 14px; }
  .tags { display: flex; gap: 11px; }
  .tags span {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1.5px solid var(--chip);
    border-radius: 999px;
    padding: 9px 18px;
  }
  .spacer { flex: 1; }
  .domain { font-family: var(--mono); font-size: 17px; color: var(--muted); letter-spacing: 0.02em; }
</style>
</head>
<body>

  <div class="top">
    <div class="avatar">YB</div>
    <div>
      <div class="name">Yehudi Baptiste</div>
      <div class="role">AI Product Leader</div>
    </div>
  </div>

  <p class="lede">Product leader building AI products where <em>reliability, trust, and outcome quality</em> drive adoption — agents, conversation intelligence, and SMB platforms.</p>

  <div class="bottom">
    <div class="tags">
      <span>AI Strategy</span>
      <span>B2B SaaS</span>
      <span>GTM</span>
    </div>
    <div class="spacer"></div>
    <div class="domain">myportfolioos.com</div>
  </div>

</body>
</html>
